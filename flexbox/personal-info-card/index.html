<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Personal info card</title>
</head>

<body>
  <main class="profile-cards">
    <section class="profile-cards__card">
      <img class="profile-cards__card--img" loading="lazy" src="/images/8.1.jpg" alt="profile">
      <div class="profile-cards__card--info">
        <p class="profile-cards__card--info__name">Alice</p>
        <p class="profile-cards__card--info__role">CEO</p>
      </div>
    </section>

    <section class="profile-cards__card">
      <img class="profile-cards__card--img" loading="lazy" src="/images/8.2.jpg" alt="profile">
      <div class="profile-cards__card--info">
        <p class="profile-cards__card--info__name">Alex</p>
        <p class="profile-cards__card--info__role">CFO</p>
      </div>
    </section>

    <section class="profile-cards__card">
      <img class="profile-cards__card--img" loading="lazy" src="/images/8.3.jpg" alt="profile">
      <div class="profile-cards__card--info">
        <p class="profile-cards__card--info__name">Joy</p>
        <p class="profile-cards__card--info__role">CMO</p>
      </div>
    </section>
  </main>
</body>

</html>
